 ebmd.24.t: "Ruling Party"
 ebmd.24.desc: "Currently in power: §Y[show_ruling_party]§!\n\n§YPut the largest party in power§! installs whichever party is most popular right now, without changing popularity. Otherwise pick an outlook to choose a specific party.\n\nTo set a party's popularity to an exact percentage, use the §YValue Setter§! panel in the decision tab: choose the party, stage the value, then apply."
 ebmd.24.a: "Put the largest party in power"
 ebmd.24.b: "Pro-Western Parties..."
 ebmd.24.c: "Emerging Parties..."
 ebmd.24.d: "Salafist Parties..."
 ebmd.24.e: "Non-Aligned Parties..."
 ebmd.24.f: "Nationalist Parties..."
 ebmd.25: "Pro-Western Parties"
 ebmd.25.t: "Pro-Western Parties"
