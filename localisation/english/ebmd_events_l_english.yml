 ebmd.23.t: "Politics"
 ebmd.23.desc: "Internal factions and party popularity, foreign influence, and Millennium Dawn's internal-politics and terror event chains."
 ebmd.23.a: "Internal Factions & Parties"
 ebmd.23.b: "Foreign Influence"
 ebmd.23.c: "Fire / Suppress Events"
 ebmd.23.d: "Ruling Party..."

