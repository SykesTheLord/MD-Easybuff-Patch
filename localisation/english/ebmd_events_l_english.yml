 # Hub
 ebmd.1: "MD Systems Cheat Menu"
 ebmd.1.t: "Millennium Dawn - Economy & Politics"
 ebmd.1.desc: "Cheats for the Millennium Dawn simulation layers that the generic Easybuff menu does not reach.\n\nSelect a category."
 ebmd.1.a: "Economy"
 ebmd.1.c: "Politics"
 ebmd.1.f: "Counter-Terrorism"
 ebmd.1.g: "Power Grid"
 ebmd.1.i: "Technology"
 ebmd.1.h: "Repair Variables"

 # Economy
 ebmd.10: "Economy"
 ebmd.10.t: "Economy"
 ebmd.10.desc: "Debt, treasury, tax, corruption, GDP, workforce, money supply and inflation.\n\nEach option calls Millennium Dawn's own effect, so MD's clamps and refresh still apply."
 ebmd.10.a: "Debt & Interest Rate"
 ebmd.10.b: "Treasury & Costs"
 ebmd.10.c: "Tax & Corruption"
 ebmd.10.d: "GDP"
 ebmd.10.e: "Workforce & Population"
 ebmd.10.f: "Monetary Expansion & Printing"
 ebmd.10.g: "Inflation & Central Bank"
 ebmd.19: "Workforce & Population"
 ebmd.19.t: "Workforce & Population"
 ebmd.19.desc: "Millennium Dawn pools workers nationally. About §Y60%§! of your population is the workforce, and the resource sector, agriculture, power plants, military factories, dockyards, civilian factories, offices and resource plants hire from it in that order. When the pool runs dry, whatever is at the back of the queue runs under-staffed and loses output.\n\n§YStaff every factory§! adds population to the states that have factories, offices and plants - in proportion to how many each has - re-running Millennium Dawn's own economy calculation after each step. It stops once §Y2-5%§! unemployment is left over, below the §Y6%§! point where high-unemployment penalties begin.\n\nThe new people are real: they add manpower, and raise healthcare and bureaucracy costs like any population. If unemployment is already above 2%, no sector is short of workers and nothing is added."
 ebmd.19.a: "Staff every factory (add population where workers are short)"

 # Debt and interest rate
 ebmd.13: "Debt & Interest Rate"
 ebmd.13.t: "Debt & Interest Rate"
 ebmd.13.desc: "MD applies no hard debt ceiling - debt is clamped only at zero. The two threshold options below work by setting the debt-to-GDP ratio, so the interest rate crosses the threshold through MD's own formula and the real penalties apply."
 ebmd.13.a: "Wipe debt (set to 0)"
 ebmd.13.b: "Set debt to 100"
 ebmd.13.c: "Force interest rate above 15% (debt = 1.6x GDP)"
 ebmd.13.d: "Force interest rate above 25% (debt = 2.6x GDP)"

 # Treasury and costs
 ebmd.14: "Treasury & Costs"
 ebmd.14.t: "Treasury & Costs"
 ebmd.14.desc: "Treasury is never set below zero: MD converts a negative treasury into fresh debt plus a fee on the next weekly tick."
 ebmd.14.a: "Set treasury to 1,000"
 ebmd.14.b: "Set treasury to 100,000"
 ebmd.14.c: "Toggle: all MD scripted costs free"

 # Tax and corruption
 ebmd.15: "Tax & Corruption"
 ebmd.15.t: "Tax & Corruption"
 ebmd.15.desc: "Corporate tax is clamped 0-50 by MD. Corruption is an idea ladder, stepped through MD's own swap effects rather than set directly."
 ebmd.15.a: "Set corporate tax to 0%"
 ebmd.15.b: "Set corporate tax to 50% (MD maximum)"
 ebmd.15.c: "Corruption to minimum"
 ebmd.15.d: "Corruption to maximum"

 # GDP warning
 ebmd.11: "GDP"
 ebmd.11.t: "GDP - read this first"
 ebmd.11.desc: "§RSetting GDP by hand does not stick.§!\n\nMD's §Ycalculate_gdp§! resets GDP to zero and rebuilds it from your factories, offices, agriculture, power plants and resource sector on every economy refresh - weekly, and immediately on any focus, decision, event or press of the economy refresh button. GDP per capita is then re-derived as GDP divided by population, so it is overwritten even sooner.\n\nUntil that refresh the edited value is live and does cascade into debt ratio, interest rate and the percent-of-GDP income and expense terms - which is exactly what you want for a one-tick test, and useless for a lasting buff.\n\nFor a change that lasts, use the persistent options below: they move what feeds the calculation instead of fighting it."
 ebmd.11.a: "Transient: double GDP now"
 ebmd.11.b: "Transient: multiply GDP by 10"
 ebmd.11.c: "Transient: halve GDP"
 ebmd.11.d: "Persistent: add the Lv4 MD Economy idea"
 ebmd.11.e: "Persistent: roughly double productivity in every controlled state"

 # Money and inflation

 # Monetary expansion and printing
 ebmd.16: "Monetary Expansion & Printing"
 ebmd.16.t: "Monetary Expansion & Printing"
 ebmd.16.desc: "Grants MD's monetary expansion idea without the currency strength loss or the 545-730 day cooldown, and adds treasury without the political power cost or the inflation carry-over."
 ebmd.16.a: "Grant monetary expansion (180 days, no penalty)"
 ebmd.16.b: "Grant monetary expansion (permanent, no penalty)"
 ebmd.16.c: "Remove monetary expansion"
 ebmd.16.d: "Print 500 - no inflation, no political power cost"
 ebmd.16.e: "Print 5,000 - no inflation, no political power cost"
 ebmd.16.f: "Clear monetary cooldowns and recent-printing flags"

 # Inflation and central bank
 ebmd.17: "Inflation & Central Bank"
 ebmd.17.t: "Inflation & Central Bank"
 ebmd.17.desc: "Inflation only recalculates quarterly, so a set value holds for up to three months. The central bank rate is the lasting lever - but note it §Yraises the interest rate§! by half its value."
 ebmd.17.a: "Set inflation to 0%"
 ebmd.17.b: "Set inflation to 2%"
 ebmd.17.c: "Set inflation to 25% (stress test)"
 ebmd.17.d: "Set central bank rate to 15% (lowers inflation, raises interest)"
 ebmd.17.e: "Set central bank rate to 0%"

