l_english:
 # Hub
 ebmd.1: "MD Systems Cheat Menu"
 ebmd.1.t: "Millennium Dawn - Economy & Politics"
 ebmd.1.desc: "Cheats for the Millennium Dawn simulation layers that the generic Easybuff menu does not reach.\n\nSelect a category."
 ebmd.1.a: "Economy"
 ebmd.1.b: "Money & Inflation"
 ebmd.1.c: "Internal Factions & Parties"
 ebmd.1.d: "Foreign Influence"
 ebmd.1.e: "Fire / Suppress Events"
 ebmd.1.f: "Counter-Terrorism"
 ebmd.1.g: "Power Grid"
 ebmd.1.h: "Repair Variables"

 # Economy
 ebmd.10: "Economy"
 ebmd.10.t: "Economy"
 ebmd.10.desc: "Debt, treasury, tax and corruption.\n\nEach option calls Millennium Dawn's own effect, so MD's clamps and refresh still apply. Treasury is never set below zero: MD converts a negative treasury into fresh debt plus a fee on the next weekly tick."
 ebmd.10.a: "Wipe debt (set to 0)"
 ebmd.10.b: "Set debt to 100"
 ebmd.10.c: "Force interest rate above 15% (debt = 1.6x GDP)"
 ebmd.10.d: "Force interest rate above 25% (debt = 2.6x GDP)"
 ebmd.10.e: "Set treasury to 1,000"
 ebmd.10.f: "Set treasury to 100,000"
 ebmd.10.g: "Toggle: all MD scripted costs free"
 ebmd.10.h: "Set corporate tax to 0%"
 ebmd.10.i: "Set corporate tax to 50% (MD maximum)"
 ebmd.10.j: "Corruption to minimum"
 ebmd.10.k: "Corruption to maximum"
 ebmd.10.l: "GDP..."

 # GDP warning
 ebmd.11: "GDP"
 ebmd.11.t: "GDP - read this first"
 ebmd.11.desc: "§RSetting GDP by hand does not stick.§!\n\nMD's §Ycalculate_gdp§! resets GDP to zero and rebuilds it from your factories, offices, agriculture, power plants and resource sector on every economy refresh - weekly, and immediately on any focus, decision, event or press of the economy refresh button. GDP per capita is then re-derived as GDP divided by population, so it is overwritten even sooner.\n\nUntil that refresh the edited value is live and does cascade into debt ratio, interest rate and the percent-of-GDP income and expense terms - which is exactly what you want for a one-tick test, and useless for a lasting buff.\n\nFor a change that lasts, use the persistent options below: they move what feeds the calculation instead of fighting it."
 ebmd.11.a: "Transient: double GDP now"
 ebmd.11.b: "Transient: multiply GDP by 10"
 ebmd.11.c: "Transient: halve GDP"
 ebmd.11.d: "Persistent: add the Lv4 MD Economy idea"
 ebmd.11.e: "Persistent: roughly double productivity in every controlled state"

 # Money and inflation
 ebmd.12: "Money & Inflation"
 ebmd.12.t: "Money & Inflation"
 ebmd.12.desc: "Monetary expansion normally costs currency strength plus a 545-730 day cooldown, and printing money feeds next quarter's inflation. These options grant the benefit and skip the price.\n\nInflation only recalculates quarterly, so a set value holds for up to three months. The central bank rate is the lasting lever - but note it §Yraises the interest rate§! by half its value."
 ebmd.12.a: "Grant monetary expansion (180 days, no penalty)"
 ebmd.12.b: "Grant monetary expansion (permanent, no penalty)"
 ebmd.12.c: "Remove monetary expansion"
 ebmd.12.d: "Print 500 - no inflation, no political power cost"
 ebmd.12.e: "Print 5,000 - no inflation, no political power cost"
 ebmd.12.f: "Clear monetary cooldowns and recent-printing flags"
 ebmd.12.g: "Set inflation to 0%"
 ebmd.12.h: "Set inflation to 2%"
 ebmd.12.i: "Set inflation to 25% (stress test)"
 ebmd.12.j: "Set central bank rate to 15% (lowers inflation, raises interest)"
 ebmd.12.k: "Set central bank rate to 0%"

 # Internal factions
 ebmd.20: "Internal Factions & Parties"
 ebmd.20.t: "Internal Factions & Parties"
 ebmd.20.desc: "Faction opinions run 0-100 and are clamped by MD. Options for a faction your country does not have are silently ignored, which is MD's own behaviour, not a failure."
 ebmd.20.a: "Set every faction to 100 (MD's own debug effect)"
 ebmd.20.b: "All factions +25"
 ebmd.20.c: "All factions -25"
 ebmd.20.d: "Oligarchs +50"
 ebmd.20.e: "Oligarchs -50"
 ebmd.20.f: "The Military +50"
 ebmd.20.g: "The Military -50"
 ebmd.20.h: "Labour Unions +50"
 ebmd.20.i: "Intelligence Community +50"
 ebmd.20.j: "The Clergy +50"
 ebmd.20.k: "Defense Industry +50"
 ebmd.20.l: "Ruling party popularity +50%"

 # Influence
 ebmd.21: "Foreign Influence"
 ebmd.21.t: "Foreign Influence"
 ebmd.21.desc: "MD stores influence as a share of each target country, capped at 100% across all influencers. There is no single-country picker here - Easybuff's menu has no target selection pattern - so influence is applied in scoped batches."
 ebmd.21.a: "Max influence over every neighbour"
 ebmd.21.b: "+25% influence over every neighbour"
 ebmd.21.c: "Max influence over every major power"
 ebmd.21.d: "+25% influence over every major power"
 ebmd.21.e: "+100% of my own domestic influence"
 ebmd.21.f: "Clear all foreign influence over me (reset to 100 domestic)"

 # Events
 ebmd.22: "Fire / Suppress Events"
 ebmd.22.t: "Fire / Suppress Events"
 ebmd.22.desc: "Fires MD internal-politics and terror events on demand for testing their chains. §YThis list is tied to the MD version§! - verify the event IDs after an MD update."
 ebmd.22.a: "Fire: internal faction demand"
 ebmd.22.b: "Fire: protest revolt"
 ebmd.22.c: "Fire: corruption roll"
 ebmd.22.d: "Fire: terror attack"
 ebmd.22.e: "Fire: international terror escalation"
 ebmd.22.f: "Suppress: auto-decline corruption events"
 ebmd.22.g: "Allow corruption events again"
 ebmd.22.h: "Clear pending protest revolt"

 # Counter-terrorism
 ebmd.30: "Counter-Terrorism"
 ebmd.30.t: "Counter-Terrorism"
 ebmd.30.desc: "MD applies no ceiling to the raw counter-terror stats, so 'maximum' here is a large chosen value rather than a documented cap.\n\nMD keeps only four spare organisation slots, so spawning stops working once they are used up - and does nothing at all if no Middle Eastern country holds a state for the headquarters."
 ebmd.30.a: "Set counter-terror capability to maximum"
 ebmd.30.b: "Zero counter-terror capability"
 ebmd.30.c: "Add the Insane Counter-Terror idea (persistent)"
 ebmd.30.d: "Add the Blind Counter-Terror idea (persistent)"
 ebmd.30.e: "Spawn one terror organisation"
 ebmd.30.f: "Spawn three terror organisations"
 ebmd.30.g: "Remove every active terror organisation"

 # Energy
 ebmd.40: "Power Grid"
 ebmd.40.t: "Power Grid"
 ebmd.40.desc: "Generation and consumption are rebuilt from scratch every recalculation, so the grid is moved through MD's energy modifiers rather than by writing the totals directly."
 ebmd.40.a: "Add the Lv3 Power Grid idea"
 ebmd.40.b: "Add the Insane Power Grid idea"
 ebmd.40.c: "Build 5 battery parks (free)"
 ebmd.40.d: "Build 25 battery parks (free)"
 ebmd.40.e: "Add hydroelectric capacity to a random state"
 ebmd.40.f: "Build 3 nuclear reactors"
 ebmd.40.g: "Recalculate the grid now"

 # Repair
 ebmd.90: "Repair Variables"
 ebmd.90.t: "Repair Variables"
 ebmd.90.desc: "Restores Millennium Dawn's own bounds after a bad value, without restarting the save. These use MD's limits, not limits of ours."
 ebmd.90.a: "Repair economy (debt, treasury, tax, GDP, inflation)"
 ebmd.90.b: "Repair politics (faction opinions, influence)"
 ebmd.90.c: "Repair counter-terror"
 ebmd.90.d: "Repair energy"
 ebmd.90.e: "Repair everything"
