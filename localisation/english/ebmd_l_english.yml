 ebmd_buildings_decision: "Millennium Dawn - Off-Map Buildings"
 ebmd_buildings_decision_desc: "Off-map buildings belong to your country but to no state, so they need no building slots and cannot be bombed or captured.\n\nOnly types that still work off-map are listed. Microchip and composite plants, offices, renewables and enrichment facilities produce nothing without a state, so they are left out.\n\n§YMillennium Dawn's GDP and taxes count buildings state by state§!, so off-map factories add real production but no GDP or tax income. Off-map reactors and power plants do add energy, and burn fuel like any other."
